# Fly.io Launch configuration for BugHunter Backend
app = "bughunter-backend" # Change this if name is taken
primary_region = "sea" # Seattle

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpus = 1
