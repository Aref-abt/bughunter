# Fly.io configuration for BugHunter Backend
# Note: Remove or change 'app' name if already taken
app = "bughunter-backend"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[vm]
  memory = '1gb'
  cpus = 1
